name: Generate EPG (DishTV + JioTV + TataPlay)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install axios dayjs

      - name: Run EPG Generator Script
        env:
          TZ: Asia/Kolkata
        run: node generate_epg.js

      - name: Commit and Push combine.xml.gz
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f epg/combine.xml.gz
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update epg/combine.xml.gz ($(date +'%Y-%m-%d %H:%M IST'))"
            git push
          fi
          
